version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mdtech-open-finance_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/m-d-tech/finance-app:1.0.5@sha256:a688dbf116236493c43d69a8eb4a80244463350073c6386b3008ddebc9cc9d72
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: America/Sao_Paulo
      DATA_DIR: /app/data
