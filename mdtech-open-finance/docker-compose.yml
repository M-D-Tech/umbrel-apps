version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mdtech-open-finance_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/m-d-tech/finance-app:1.0.3@sha256:5ffd2477add3fad85800179812fdb373a51603e2c3757f4f22415d8995b02266
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: America/Sao_Paulo
      DATA_DIR: /app/data
