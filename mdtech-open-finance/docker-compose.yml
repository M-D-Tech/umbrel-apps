version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mdtech-open-finance_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/m-d-tech/finance-app:1.0.4@sha256:65ed7580e9c75d1ddb171cfc239e0d046e71ea7c502ca19a597158a34546e87e
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: America/Sao_Paulo
      DATA_DIR: /app/data
